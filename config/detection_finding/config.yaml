class_name: detection_finding
class_uid: 2004
essential_fields:
  - polearms: activity_id
  - polearms: activity_name
  - polearms: actor.app_name
  - polearms: actor.user.email_addr
  - polearms: actor.user.name
  - polearms: actor.user.type
  - polearms: actor.user.uid
  - polearms: arcticwolf.customer.id
  - polearms: arcticwolf.customer.uuid
  - polearms: arcticwolf.deployment.id
  - polearms: arcticwolf.deployment.uuid
  - polearms: arcticwolf.ingestion_service.endpoint.name
  - polearms: attacks[].sub_technique.src_url
  - polearms: attacks[].tactic.name
  - polearms: attacks[].tactic.src_url
  - polearms: attacks[].tactic.uid
  - polearms: attacks[].technique.name
  - polearms: attacks[].technique.src_url
  - polearms: attacks[].technique.uid
  - polearms: class_uid
  - polearms: device.type
  - polearms: disposition
  - polearms: evidences[].dst_endpoint.hostname
  - polearms: evidences[].dst_endpoint.ip
  - polearms: evidences[].dst_endpoint.port
  - polearms: evidences[].dst_endpoint.proxy_endpoint.ip
  - polearms: evidences[].http_request.http_method
  - polearms: evidences[].http_request.length
  - polearms: evidences[].http_request.referrer
  - polearms: evidences[].http_request.uid
  - polearms: evidences[].http_request.url.path
  - polearms: evidences[].http_request.url.scheme
  - polearms: evidences[].http_request.url.url_string
  - polearms: evidences[].http_request.user_agent
  - polearms: evidences[].http_response.body_length
  - polearms: evidences[].http_response.code
  - polearms: evidences[].resources[].hostname
  - polearms: evidences[].src_endpoint.ip
  - polearms: evidences[].src_endpoint.location.city
  - polearms: evidences[].src_endpoint.location.country
  - polearms: evidences[].src_endpoint.location.lat
  - polearms: evidences[].src_endpoint.location.long
  - polearms: evidences[].src_endpoint.port
  - polearms: evidences[].tls.certificate.fingerprints[].value
  - polearms: firewall_rule.desc
  - polearms: firewall_rule.match_location
  - polearms: firewall_rule.name
  - polearms: firewall_rule.type
  - polearms: firewall_rule.uid
  - polearms: malware_scan_info.size
  - polearms: malware_scan_info.type
  - polearms: message
  - polearms: metadata.log_level
  - polearms: metadata.log_name
  - polearms: metadata.log_source
  - polearms: metadata.source
  - polearms: metadata.tenant_uid
  - polearms: severity_id
  - polearms: status
  - polearms: time

override_mappings:
  - polearms: evidences[x].src_endpoint.ip
    swords: c-ip
    labels:
      x: "index==0"
    mapper:
      fn: map_evidence_client_ip
      args:
        evidences: evidences

  - polearms: evidences[x].src_endpoint.port
    swords: c-port
    labels:
      x: "index==0"
    mapper:
      fn: map_evidence_client_port
      args:
        evidences: evidences

  - polearms: evidences[x].dst_endpoint.ip
    swords: s-ip
    labels:
      x: "index==0"
    mapper:
      fn: map_evidence_server_ip
      args:
        evidences: evidences

  - polearms: evidences[x].src_endpoint.location.city
    swords: cloud.client.geoip.city
    labels:
      x: "index==0"
    mapper:
      fn: map_evidence_geoip_city
      args:
        evidences: evidences

  - polearms: evidences[x].src_endpoint.location.country
    swords: cloud.client.geoip.country
    labels:
      x: "index==0"
    mapper:
      fn: map_evidence_geoip_country
      args:
        evidences: evidences

  - polearms: evidences[x].src_endpoint.location.lat
    swords: cloud.client.geoip.latitude
    labels:
      x: "index==0"
    mapper:
      fn: map_evidence_geoip_latitude
      args:
        evidences: evidences

  - polearms: evidences[x].src_endpoint.location.long
    swords: cloud.client.geoip.longitude
    labels:
      x: "index==0"
    mapper:
      fn: map_evidence_geoip_longitude
      args:
        evidences: evidences

  - polearms: evidences[x].http_response.code
    swords: http.status
    labels:
      x: "index==0"
    mapper:
      fn: map_evidence_http_status
      args:
        evidences: evidences

  - polearms: evidences[x].http_request.http_method
    swords: http.method
    labels:
      x: "index==0"
    mapper:
      fn: map_evidence_http_method
      args:
        evidences: evidences

  - polearms: evidences[x].http_request.referrer
    swords: http.referer
    labels:
      x: "index==0"
    mapper:
      fn: map_evidence_http_referer
      args:
        evidences: evidences

  - polearms: evidences[x].http_request.url.url_string
    swords: http.uri
    labels:
      x: "index==0"
    mapper:
      fn: map_evidence_http_uri
      args:
        evidences: evidences

  - polearms: evidences[x].http_request.user_agent
    swords: user-agent.raw
    labels:
      x: "index==0"
    mapper:
      fn: map_evidence_user_agent
      args:
        evidences: evidences

  - polearms:
      - evidences[x].src_endpoint.ip
      - evidences[y].dst_endpoint.ip
      - evidences[z].dst_endpoint.proxy_endpoint.ip
    swords: related.ip
    labels:
      x: "index>0 && src_endpoint.ip != null"
      y: "index>0 && dst_endpoint.ip != null"
      z: "index>0 && dst_endpoint.proxy_endpoint.ip != null"
    mapper:
      fn: map_evidence_related_ip
      args:
        evidences: evidences

  - polearms: evidences[x].tls.certificate.fingerprints[y].value
    swords: threat.enrichments[].indicator.hash.md5
    labels:
      x: "tls.certificate.fingerprints!=null"
      y: "algorithm_id==1"
    mapper:
      fn: map_evidence_hash_md5
      args:
        evidences: evidences

  - polearms: evidences[x].tls.certificate.fingerprints[y].value
    swords: threat.enrichments[].indicator.hash.sha1
    labels:
      x: "tls.certificate.fingerprints!=null"
      y: "algorithm_id==2"
    mapper:
      fn: map_evidence_hash_sha1
      args:
        evidences: evidences

  - polearms: evidences[x].tls.certificate.fingerprints[y].value
    swords: threat.enrichments[].indicator.hash.sha256
    labels:
      x: "tls.certificate.fingerprints!=null"
      y: "algorithm_id==3"
    mapper:
      fn: map_evidence_hash_sha256
      args:
        evidences: evidences

  - polearms: evidences[x].dst_endpoint.hostname
    swords: s-hostname
    labels:
      x: "index==0"
    mapper:
      fn: map_evidence_server_hostname
      args:
        evidences: evidences

  - polearms: evidences[x].dst_endpoint.port
    swords: s-port
    labels:
      x: "index==0"
    mapper:
      fn: map_evidence_server_port
      args:
        evidences: evidences

  - polearms: evidences[x].http_request.length
    swords: cs-bytes
    labels:
      x: "index==0"
    mapper:
      fn: map_evidence_request_length
      args:
        evidences: evidences

  - polearms: evidences[x].http_request.url.scheme
    swords: cs-scheme
    labels:
      x: "index==0"
    mapper:
      fn: map_evidence_request_scheme
      args:
        evidences: evidences

  - polearms: evidences[x].http_request.uid
    swords: http.request-id
    labels:
      x: "index==0"
    mapper:
      fn: map_evidence_request_uid
      args:
        evidences: evidences

  - polearms: evidences[x].http_request.url.path
    swords: cloud.resource.path
    labels:
      x: "index==0"
    mapper:
      fn: map_evidence_request_path
      args:
        evidences: evidences

  - polearms: evidences[x].http_response.body_length
    swords: sc-bytes
    labels:
      x: "index==0"
    mapper:
      fn: map_evidence_response_body_length
      args:
        evidences: evidences

  - polearms: evidences[x].resources[y].hostname
    swords: url.security_zone
    labels:
      x: "index==0"
      y: "hostname!=null"
    mapper:
      fn: map_evidence_security_zone
      args:
        evidences: evidences
