name: Pull request

# The checks for a pull request into main, in order:
#
#   1. compile    compile-schema.yaml: if schema.json was built from different OCSF or Arctic Wolf
#                 extension versions than schema_definition.yaml names, rebuild it and the class map
#                 and commit them to the branch; otherwise do nothing
#   2. validate   validate.yaml, once compile has finished. If compile pushed a commit, validate runs
#                 on it, so the new schema is what gets validated
#
# Validate waits for compile because the validators read schema.json. If compile fails, validate
# does not run.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the pull request supersedes the older run. A run that is cancelled while compile is
# in progress is safe: compile commits all-or-nothing, in its last step.
concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compile:
    # Committing to the pull request's branch needs write access, which nothing else here has.
    permissions:
      contents: write
    uses: ./.github/workflows/compile-schema.yaml

  validate:
    needs: compile
    uses: ./.github/workflows/validate.yaml
    with:
      # The commit compile pushed, so the new schema is what gets validated. If compile had nothing
      # to do there is none, and the empty value makes validate check out the pull request's usual
      # merge commit, so it still catches a conflict with a newer main.
      ref: ${{ needs.compile.outputs.sha }}
