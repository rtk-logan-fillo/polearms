name: Pull request

# The checks for a pull request into main that changes anything outside schema/. A pull request that
# only changes schema/ is handled by validate-and-compile-schema.yaml instead.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "schema/**"

permissions:
  contents: read

# A newer push to the pull request supersedes the older run.
concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create virtualenv
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Validate release version
        run: python -m scripts.validate_release_version

      # The SWORDS schema is downloaded from the private parse_and_detect repository, which the
      # workflow's own token cannot read.
      - name: Validate mappings
        env:
          GH_TOKEN: ${{ secrets.PARSE_AND_DETECT_TOKEN }}
        run: python -m scripts.validate_mappings

      - name: Validate config
        run: python -m scripts.validate_config

      - name: Run tests
        run: python -m pytest
