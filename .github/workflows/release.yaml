name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error file=VERSION::'$version' is not a valid semantic version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check whether tag already exists
        id: tag_check
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.version.outputs.tag }}" > /dev/null; then
            echo "::warning::Tag ${{ steps.version.outputs.tag }} already exists; bump VERSION to publish a new release."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.tag_check.outputs.exists == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate class map
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          pip install pyyaml
          python scripts/generate_class_map.py

      - name: Build repository archives
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          name="polearms-${{ steps.version.outputs.version }}"
          # Archive a tree that includes the regenerated class map (git archive HEAD would not).
          git add mappings/class_map.yaml
          tree="$(git write-tree)"
          mkdir -p dist
          for format in tar.gz zip; do
            git archive --format="$format" --prefix="$name/" -o "dist/$name.$format" "$tree"
            git archive --format="$format" --prefix="$name/" -o "dist/$name-schemaless.$format" "$tree" -- . ':(exclude)schema'
          done

      - name: Create tag and release
        if: steps.tag_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" dist/* \
            --target "${{ github.sha }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes
