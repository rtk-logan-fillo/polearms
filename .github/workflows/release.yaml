name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          if ! version="$(python3 - <<'PY' 2>&1
          import json, sys
          try:
              data = json.load(open("version.json"))
          except (OSError, json.JSONDecodeError) as err:
              sys.exit(f"version.json is not readable JSON ({err})")
          version = data.get("version") if isinstance(data, dict) else None
          if not isinstance(version, str):
              sys.exit('version.json must be an object with a string "version"')
          print(version.strip())
          PY
          )"; then
            echo "::error file=version.json::$version"
            exit 1
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error file=version.json::'$version' is not a valid semantic version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$version" >> "$GITHUB_OUTPUT"

      - name: Check whether tag already exists
        id: tag_check
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.version.outputs.tag }}" > /dev/null; then
            echo "::warning::Version ${{ steps.version.outputs.tag }} is already released (tag ${{ steps.version.outputs.tag }} exists); bump the version in version.json to publish a new release."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.tag_check.outputs.exists == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create virtualenv
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Publish Confluence pages
        if: steps.tag_check.outputs.exists == 'false'
        env:
          CONFLUENCE_USER: ${{ secrets.CONFLUENCE_USER }}
          CONFLUENCE_TOKEN: ${{ secrets.CONFLUENCE_TOKEN }}
          GH_TOKEN: ${{ secrets.PARSE_AND_DETECT_TOKEN }}
        run: |
          python -m scripts.generate_confluence_pages \
            --confluence-user "$CONFLUENCE_USER" \
            --confluence-token "$CONFLUENCE_TOKEN"

      - name: Build repository archives
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          name="polearms-${{ steps.version.outputs.version }}"
          mkdir -p dist
          for format in tar.gz zip; do
            git archive --format="$format" --prefix="$name/" -o "dist/$name.$format" HEAD
            git archive --format="$format" --prefix="$name/" -o "dist/$name-schemaless.$format" HEAD -- . ':(exclude)schema'
          done

      - name: Create tag and release
        if: steps.tag_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" dist/* \
            --target "${{ github.sha }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes
