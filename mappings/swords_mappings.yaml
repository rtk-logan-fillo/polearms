- polearms: time
  swords: "@carser_timestamp"
  mapper:
    fn: map_time

- polearms: severity_id
  swords: threat.severity

- polearms: attacks[].tactic.uid
  swords: threat.tactic.id

- polearms: attacks[].tactic.name
  swords: threat.tactic.name

- polearms: attacks[].tactic.src_url
  swords: threat.tactic.reference
  join: ", "

- polearms: attacks[].technique.uid
  swords: threat.technique.id
  join: ", "

- polearms: attacks[].technique.name
  swords: threat.technique.name

- polearms: attacks[].technique.src_url
  swords: threat.technique.reference
  join: ", "

- polearms: attacks[].sub_technique.src_url
  swords: threat.technique.subtechnique.reference
  join: ", "

- polearms: activity_id
  swords: event.id
  mapper:
