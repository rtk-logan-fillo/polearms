# TODO: fix this
# - polearms: malware[].classifications[]
#   swords: vulnerability.classification
#   join: ", "

- polearms: malware_scan_info.size
  swords: threat.enrichments[].indicator.file.size
  mapper:
    fn: map_to_string

- polearms: malware_scan_info.type
  swords: threat.enrichments[].indicator.file.type

- polearms: user_result.groups[].uid
  swords: ad.event.target.changed-attributes.primary-group-id
  join: ", "

- polearms: file.hashes[x].value
  swords: file.hash.md5
  selectors:
    x:
      label: "find(x -> x.algorithm==MD5)"
      fn: select_first_md5

- polearms: file.hashes[x].value
  swords: file.hash.sha1
  selectors:
    x:
      label: "find(x -> x.algorithm==SHA-1)"
      fn: select_first_sha1

- polearms: file.hashes[x].value
  swords: file.hash.sha256
  selectors:
    x:
      label: "find(x -> x.algorithm==SHA-256)"
      fn: select_first_sha256

- polearms: file.hashes[x].value
  swords: file.hash.imphash
  selectors:
    x:
      label: "find(x -> x.algorithm==Imphash)"
      fn: select_first_imphash

- polearms: privileges[]
  swords: cloud.client.user.privileges
  join: ", "
